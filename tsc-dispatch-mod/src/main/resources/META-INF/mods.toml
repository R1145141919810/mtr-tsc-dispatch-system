[[mods]]
modId="tscdispatch"
version="1.0.0"
displayName="TSC Dispatch Service"
authors="tsc-dispatch"
# No network protocol: a client running this must still be able to join servers without it,
# and a server must not require it on the client.
displayTest="IGNORE_ALL_VERSION"
description='''Runs the external dynamic dispatch service inside the game process.

The service itself is a plain-Java component that only speaks HTTP: it reads telemetry from
the mod's read-only web API, and (when a control bridge is present) sends commands through
that bridge. This mod is a thin loader - it starts and stops that component together with the
integrated or dedicated server, so the service can be used without a second JVM.

Dashboard: http://127.0.0.1:8787/   Config: config/tsc-dispatch.yml'''

[[dependencies.tscdispatch]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tscdispatch]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
